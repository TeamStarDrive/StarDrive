# more docile neutron star, not emitting a pulsar beam
# but there is still a gentle additive neutron blast
- Sun:
  Id: star_neutron
  IconPath: Suns/neutron_blast_icon.png
  IconScale: 8
  IconLayer: 2 # get rotation from glow flare
  LightIntensity: 1.4
  Radius: 150000
  LightColor: [225,235,255] # Blueish tint
  Habitable: false # this star is dangerous and leaves all planets barren
  RadiationDamage: 10 # applied every 0.5 seconds, falls off depending on RadiationRadius
  RadiationRadius: 15000
  ResearchableChance: 60
  Layers: # huge radiation layer
    - Layer:
      TexturePath: Suns/radiation_purple.dds
      BlendMode: Additive
      TextureColor: [0.2,0.6,1.0,1.0] # blue tint
      LayerScale: 0.8
      RotationSpeed: 0.005
      PulsePeriod: 10.0
      PulseScale: [1.0,1.01]
      PulseColor: [0.4,0.6]
    - Layer: # huge radiation layer
      TexturePath: Suns/radiation_purple.dds
      BlendMode: Additive
      TextureColor: [0.2,0.6,1.0,1.0] # blue tint
      LayerScale: 0.8
      RotationSpeed: -0.005
      RotationStart: 1.57
      PulsePeriod: 10.0
      PulseScale: [1.0,1.02]
      PulseColor: [0.4,0.6]
    - Layer: # background glow flare
      TexturePath: Suns/neutron_blast.dds
      BlendMode: AlphaBlend
      RotationSpeed: 0.1
      RotationStart: 0.0
      LayerScale: 0.9
      PulsePeriod: 2
      PulseScale: [1.0,1.025]
    - Layer: # rotating white core with cloud
      TexturePath: Suns/star_neutron1.dds
      BlendMode: AlphaBlend
      RotationSpeed: -6
      RotationStart: 0.0
      LayerScale: 0.15
      PulsePeriod: 5.0
      PulseColor: [1.1,1.5]
    - Layer: # additive glow flare
      TexturePath: Suns/neutron_blast.dds
      BlendMode: Additive
      RotationSpeed: 0.1
      RotationStart: 0.0
      LayerScale: 0.9
      PulsePeriod: 2
      PulseScale: [1.0,1.025]
      PulseColor: [0.5,0.9]

