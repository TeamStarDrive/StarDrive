# Tooltip -> Codex entry links.
#
# One row per tooltip: the GameText NameId of the tooltip text, then the UID of
# the Codex.yaml entry that explains it. Every tooltip showing that token, on
# any screen, gains a "Press F1 for details" line and F1 opens the entry.
#
# The entry must be a topic, or a category with a body of its own: a bare
# header only expands on click. A row naming a token or entry that does not
# exist, a bare header, or an entry inside a Hidden branch is skipped with a
# warning in blackbox.log. Re-read every time the Codex screen opens, so rows
# can be added with the game running.

