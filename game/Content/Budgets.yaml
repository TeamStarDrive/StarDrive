# Only the All block is read. Spy: an AI's agent budget under legacy espionage. Espionage: an AI's budget
# for extra espionage points under the new system, above Normal difficulty. The player spends neither;
# its planner hands the player's Build and Spy weights to its governor budgets.
- BudgetSettings:
  PortraitName: All
  Budgets:
    Defense: 2
    SSP: 1
    Build: 6
    Spy: 25
    Espionage: 1 
    Colony: 8
    Terraform: 2
    Savings: 400